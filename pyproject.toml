[project]
name = "atlas"
version = "0.1.0"
description = "Atlas: the route-planning layer for browser agents, on HydraDB"
# 3.12 is the reference (Docker and CI pin it); 3.13 is allowed for local development.
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "neo4j==6.4.1",
    "playwright==1.65.2",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "anthropic==2.8.0",
    "sse-starlette==3.7.0",
    # TestMart (benchmark site)
    "Jinja2==3.1.6",
    "python-multipart==0.0.33",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "ruff==0.17.5",
    "pyright==1.1.414",
]
bench = [
    "matplotlib==3.11.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*", "testmart*", "eval*"]

[tool.setuptools.package-data]
testmart = ["templates/*.html"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["spikes", "hydradb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ANN", "T20", "RUF"]
ignore = ["S101"]  # assert is how pytest works; production asserts are caught in review

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"testmart/**" = ["ANN", "S", "E501", "B", "SIM", "RUF", "UP", "T20"]
"scripts/**" = ["T20"]

[tool.pyright]
include = ["atlas"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["atlas/core", "atlas/contracts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["sdk"]
addopts = "-q -ra"
markers = [
    "integration: needs a running HydraDB (HYDRADB_URL); skipped cleanly when unset",
    "e2e: needs the full stack (ATLAS_E2E=1, TestMart, HydraDB, a model key)",
]

[tool.ruff.lint.isort]
known-first-party = ["atlas", "testmart", "eval", "tests"]

[tool.ruff.format]
exclude = ["testmart/*.py"]  # lane T code is linted but keeps its own formatting
