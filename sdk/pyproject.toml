[project]
name = "atlas-route-sdk"
version = "0.2.0"
description = "Thin Python client for the Atlas Route API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yash Yadav" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]

[project.urls]
Homepage = "https://atlas.yashdynamo.fun"
Source = "https://github.com/YASH-YADAV-dynamo/atlas"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_sdk", "atlas_sdk.drivers"]
