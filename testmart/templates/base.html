<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TestMart{% endblock %} - TestMart</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;color:#222}
header,main{max-width:900px;margin:0 auto;padding:12px 16px}
nav ul{list-style:none;display:flex;gap:16px;padding:0;margin:0;align-items:center}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid #ddd;padding:6px;text-align:left}
label{display:block;margin:8px 0 4px}
.alert{background:#fee;border:1px solid #c88;padding:8px}
.tabs{margin-bottom:16px}
</style>
</head>
<body data-ui-version="{{ ui_version }}">
{% if show_nav|default(true) %}
<header>
  <nav aria-label="Main">
    <ul>
      <li><a href="/">Dashboard</a></li>
      <li><a href="/orders">Orders</a></li>
      {% if ui_version == 2 %}<li><a href="/more">More</a></li>{% else %}<li><a href="/customers">Customers</a></li>{% endif %}
      <li><a href="/products">Products</a></li>
      <li><a href="/settings">Settings</a></li>
      <li><form method="post" action="/logout"><button type="submit">Log out</button></form></li>
    </ul>
  </nav>
</header>
{% endif %}
<main>
<h1>{% block heading %}{% endblock %}</h1>
{% block content %}{% endblock %}
</main>
</body>
</html>
